<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar animal · Sistema de Adoção</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="img/logo.png" alt="Logo Adoção: um laço de amor">
    <button class="btn btn-nav" id="btn-inicio" type="button">Início</button>
    <span class="espaco"></span>
    <button class="btn btn-nav" id="btn-deslogar" type="button">Deslogar</button>
  </header>

  <main>
    <h1>Cadastrar Animal</h1>
    <p class="subtitulo">Informe os dados do animal que está disponível para adoção.</p>

    <form class="form-caixa estreito form-coluna" id="form-pet" novalidate>
      <div class="campo">
        <label for="nome">Nome do animal:</label>
        <input id="nome" name="nome" autocomplete="off">
        <span class="msg-erro"></span>
      </div>

      <div class="campo">
        <label for="raca">Raça:</label>
        <input id="raca" name="raca" autocomplete="off">
        <span class="msg-erro"></span>
      </div>

      <div class="campo">
        <label for="abrigo">Abrigo:</label>
        <input id="abrigo" name="abrigo" autocomplete="off">
        <span class="msg-erro"></span>
      </div>

      <div class="acao-form">
        <button class="btn btn-primario" type="submit">CADASTRAR</button>
      </div>
    </form>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cadastro-pet.js"></script>
</body>
</html>
