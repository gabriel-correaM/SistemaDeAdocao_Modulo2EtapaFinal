<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro · Sistema de Adoção</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="pagina-cadastro">
  <header class="cabecalho">
    <img class="logo" src="img/logo.png" alt="Logo Adoção: um laço de amor">
  </header>

  <main>
    <h1 id="titulo">Tela de cadastro</h1>
    <p class="subtitulo">Preencha seus dados para começar a usar o sistema.</p>

    <form class="form-caixa largo" id="form-cadastro" novalidate>
      <div class="grade">
        <div class="campo">
          <label for="nome">Nome completo:</label>
          <input id="nome" name="nome" autocomplete="name">
          <span class="msg-erro"></span>
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <span class="msg-erro"></span>
        </div>

        <div class="campo">
          <label for="telefone">Telefone:</label>
          <input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" autocomplete="tel">
          <span class="msg-erro"></span>
        </div>

        <div class="campo">
          <label for="senha">Senha:</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password">
          <span class="msg-erro"></span>
        </div>
      </div>

      <div class="acao-form">
        <button class="btn btn-primario" type="submit">Cadastrar</button>
      </div>
    </form>

    <form class="form-caixa estreito form-coluna oculto" id="form-login" novalidate>
      <div class="campo">
        <label for="login-email">Email:</label>
        <input id="login-email" name="email" type="email" autocomplete="email">
        <span class="msg-erro"></span>
      </div>

      <div class="campo">
        <label for="login-senha">Senha:</label>
        <input id="login-senha" name="senha" type="password" autocomplete="current-password">
        <span class="msg-erro"></span>
      </div>

      <div class="acao-form">
        <button class="btn btn-primario" type="submit">Entrar</button>
      </div>
    </form>

    <p class="troca" id="troca-cadastro">
      Já tem cadastro? <button type="button" id="ir-login">Entrar</button>
    </p>

    <p class="troca oculto" id="troca-login">
      Ainda não tem cadastro? <button type="button" id="ir-cadastro">Cadastrar</button>
    </p>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
