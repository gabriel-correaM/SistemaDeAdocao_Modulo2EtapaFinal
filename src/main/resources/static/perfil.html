<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · Sistema de Adoção</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="img/logo.png" alt="Logo Adoção: um laço de amor">
    <button class="btn btn-nav" id="btn-inicio" type="button">Início</button>
    <span class="espaco"></span>
    <button class="btn btn-nav" id="btn-deslogar" type="button">Deslogar</button>
  </header>

  <main>
    <h1>Perfil do usuário</h1>
    <p class="subtitulo">Seus dados cadastrados.</p>

    <section class="perfil-caixa">
      <img class="avatar" src="img/perfil.jpg" alt="Foto de perfil">

      <dl class="dados">
        <dt>Nome completo:</dt>
        <dd id="p-nome"></dd>

        <dt>Email:</dt>
        <dd id="p-email"></dd>

        <dt>Senha:</dt>
        <dd>
          <span id="p-senha"></span>
          <button class="ver-senha" id="ver-senha" type="button">mostrar</button>
        </dd>

        <dt>Telefone:</dt>
        <dd id="p-telefone"></dd>
      </dl>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
