spring.application.name=sistema-adocao-web

# Banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_adocao?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080
